name: matilha

services:
  notification-db:
    image: postgres:17
    container_name: matilha-notification-db
    environment:
      POSTGRES_DB: ${NOTIFICATION_DB_NAME:?defina NOTIFICATION_DB_NAME no .env}
      POSTGRES_USER: ${NOTIFICATION_DB_USERNAME:?defina NOTIFICATION_DB_USERNAME no .env}
      POSTGRES_PASSWORD: ${NOTIFICATION_DB_PASSWORD:?defina NOTIFICATION_DB_PASSWORD no .env}
    ports:
      - "127.0.0.1:5434:5432"
    volumes:
      - notification-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 10

  notification:
    build: .
    container_name: matilha-notification
    ports:
      - "127.0.0.1:8083:8083"
    environment:
      SPRING_PROFILES_ACTIVE: dev
      NOTIFICATION_DB_URL: jdbc:postgresql://notification-db:5432/${NOTIFICATION_DB_NAME:?defina NOTIFICATION_DB_NAME no .env}
      NOTIFICATION_DB_USERNAME: ${NOTIFICATION_DB_USERNAME:?defina NOTIFICATION_DB_USERNAME no .env}
      NOTIFICATION_DB_PASSWORD: ${NOTIFICATION_DB_PASSWORD:?defina NOTIFICATION_DB_PASSWORD no .env}
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      KEYCLOAK_JWK_SET_URI: http://keycloak:8080/realms/matilha/protocol/openid-connect/certs
    depends_on:
      notification-db:
        condition: service_healthy
      kafka:
        condition: service_healthy

volumes:
  notification-db-data:
