spring:
  application:
    name: matilha-gateway

  lifecycle:
    timeout-per-shutdown-phase: 20s

  web:
    error:
      include-message: never
      include-binding-errors: never
      include-stacktrace: never
      include-exception: false

  cloud:
    gateway:
      server:
        webmvc:
          routes:
            - id: account
              uri: ${matilha.account.base-url}
              predicates:
                - Path=/accounts/**
            - id: transfer
              uri: ${matilha.transfer.base-url}
              predicates:
                - Path=/transfers/**
            - id: notification
              uri: ${matilha.notification.base-url}
              predicates:
                - Path=/notifications/**
  http:
    clients:
      connect-timeout: 2s
      read-timeout: 10s
  
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUER_URI:http://localhost:8180/realms/matilha}
          jwk-set-uri: ${KEYCLOAK_JWK_SET_URI:http://localhost:8180/realms/matilha/protocol/openid-connect/certs}
          audiences: matilha-api

server:
  port: 8080
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health, info
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true
  info:
    env:
      enabled: true

info:
  app:
    name: matilha-gateway
    description: API gateway

matilha:
  account:
    base-url: ${ACCOUNT_SERVICE_URL:http://localhost:8081}
  transfer:
    base-url: ${TRANSFER_SERVICE_URL:http://localhost:8082}
  notification:
    base-url: ${NOTIFICATION_SERVICE_URL:http://localhost:8083}
