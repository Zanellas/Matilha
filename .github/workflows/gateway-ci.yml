name: matilha-gateway CI

on:
  push:
    branches: [main]
    paths: ['matilha-gateway/**', '.github/workflows/gateway-ci.yml']
  pull_request:
    paths: ['matilha-gateway/**', '.github/workflows/gateway-ci.yml']

defaults:
  run:
    working-directory: matilha-gateway

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
          cache-dependency-path: matilha-gateway/pom.xml

      - name: Testes
        run: ./mvnw -B verify

  docker:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Build da imagem
        run: docker build -t matilha-gateway .
