apiVersion: v1
kind: ConfigMap
metadata:
  name: notification-config
data:
  NOTIFICATION_DB_URL: jdbc:postgresql://notification-db:5432/matilha_notification
  KAFKA_BOOTSTRAP_SERVERS: kafka:9092
---
apiVersion: v1
kind: Service
metadata:
  name: notification
spec:
  selector:
    app: notification
  ports:
    - port: 8083
      targetPort: 8083
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: notification
spec:
  replicas: 2
  selector:
    matchLabels:
      app: notification
  template:
    metadata:
      labels:
        app: notification
    spec:
      enableServiceLinks: false
      terminationGracePeriodSeconds: 40
      containers:
        - name: notification
          image: matilha-notification:dev
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8083
          envFrom:
            - configMapRef:
                name: notification-config
          env:
            - name: NOTIFICATION_DB_USERNAME
              valueFrom:
                secretKeyRef:
                  name: notification-db-secret
                  key: POSTGRES_USER
            - name: NOTIFICATION_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: notification-db-secret
                  key: POSTGRES_PASSWORD
          startupProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8083
            periodSeconds: 5
            failureThreshold: 30
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8083
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8083
            periodSeconds: 5
          lifecycle:
            preStop:
              sleep:
                seconds: 5
          resources:
            requests:
              memory: 384Mi
            limits:
              memory: 768Mi
