apiVersion: v1
kind: ConfigMap
metadata:
  name: account-config
data:
  ACCOUNT_DB_URL: jdbc:postgresql://account-db:5432/matilha_account
  SPRING_FLYWAY_LOCATIONS: classpath:db/migration,classpath:db/seed
---
apiVersion: v1
kind: Service
metadata:
  name: account
spec:
  selector:
    app: account
  ports:
    - port: 8081
      targetPort: 8081
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: account
spec:
  replicas: 1
  selector:
    matchLabels:
      app: account
  template:
    metadata:
      labels:
        app: account
    spec:
      enableServiceLinks: false
      terminationGracePeriodSeconds: 40
      containers:
        - name: account
          image: matilha-account:dev
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8081
          envFrom:
            - configMapRef:
                name: account-config
          env:
            - name: ACCOUNT_DB_USERNAME
              valueFrom:
                secretKeyRef:
                  name: account-db-secret
                  key: POSTGRES_USER
            - name: ACCOUNT_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: account-db-secret
                  key: POSTGRES_PASSWORD
          startupProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8081
            periodSeconds: 5
            failureThreshold: 30
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8081
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8081
            periodSeconds: 5
          lifecycle:
            preStop:
              sleep:
                seconds: 5
          resources:
            requests:
              memory: 384Mi
            limits:
              memory: 768Mi