spring:
  data:
    web:
      pageable:
        default-page-size: 20
        max-page-size: 100
        serialization-mode: via-dto

  application:
    name: matilha-account

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/matilha_account}
    username: ${DB_USERNAME_MATILHA:matilha}
    password: ${DB_PASSWORD_MATILHA:matilha}

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    open-in-view: false
    properties:
      hibernate:
        "[format_sql]": true

server:
  port: 8081

management:
  endpoints:
    web:
      exposure:
        include: health, info
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true
  info:
    env:
      enabled: true

info:
  app:
    name: matilha-account
    description: Account service
