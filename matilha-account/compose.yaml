services:
  postgres:
    image: postgres:17
    container_name: matilha-postgres
    environment:
      POSTGRES_DB_MATILHA: matilha_account
      POSTGRES_USER_MATILHA: matilha
      POSTGRES_PASSWORD_MATILHA: matilha
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

volumes:
  postgres-data: