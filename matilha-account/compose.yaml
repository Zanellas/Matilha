services:
  postgres:
    image: postgres:17
    container_name: matilha-postgres
    environment:
      POSTGRES_DB: ${ACCOUNT_DB_NAME:?defina ACCOUNT_DB_NAME no .env}
      POSTGRES_USER: ${ACCOUNT_DB_USERNAME:?defina ACCOUNT_DB_USERNAME no .env}
      POSTGRES_PASSWORD: ${ACCOUNT_DB_PASSWORD:?defina ACCOUNT_DB_PASSWORD no .env}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 10

  account:
    build: .
    container_name: matilha-account
    ports:
      - "127.0.0.1:8081:8081"
    environment:
      SPRING_PROFILES_ACTIVE: dev
      ACCOUNT_DB_URL: jdbc:postgresql://postgres:5432/${ACCOUNT_DB_NAME:?defina ACCOUNT_DB_NAME no .env}
      ACCOUNT_DB_USERNAME: ${ACCOUNT_DB_USERNAME:?defina ACCOUNT_DB_USERNAME no .env}
      ACCOUNT_DB_PASSWORD: ${ACCOUNT_DB_PASSWORD:?defina ACCOUNT_DB_PASSWORD no .env}
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres-data:
