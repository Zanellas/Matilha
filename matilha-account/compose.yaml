services:
  postgres:
    image: postgres:17
    container_name: matilha-postgres
    environment:
      POSTGRES_DB: matilha_account
      POSTGRES_USER: matilha
      POSTGRES_PASSWORD: matilha
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

volumes:
  postgres-data: